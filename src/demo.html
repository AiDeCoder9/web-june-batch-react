<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recipe Collection</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b">
      <div class="mx-auto px-4 py-6 container">
        <h1 class="font-bold text-gray-800 text-3xl">Recipe Collection</h1>
        <p class="mt-2 text-gray-600">
          Discover delicious recipes from around the world
        </p>
      </div>
    </header>

    <!-- Loading State -->
    <div id="loading" class="mx-auto px-4 py-8 container">
      <div class="flex justify-center items-center">
        <div
          class="border-b-2 border-blue-600 rounded-full w-12 h-12 animate-spin"
        ></div>
        <span class="ml-3 text-gray-600">Loading recipes...</span>
      </div>
    </div>

    <!-- Main Content -->
    <main class="mx-auto px-4 py-8 container">
      <!-- Layout Toggle -->
      <div class="flex justify-end mb-6">
        <div class="bg-white shadow-sm p-1 border rounded-lg">
          <button
            id="gridView"
            class="bg-blue-600 px-4 py-2 rounded-md text-white transition-colors"
          >
            Grid
          </button>
          <button
            id="listView"
            class="hover:bg-gray-100 px-4 py-2 rounded-md text-gray-600 transition-colors"
          >
            List
          </button>
        </div>
      </div>

      <!-- Recipe Grid/List -->
      <div
        id="recipeContainer"
        class="gap-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
      >
        <!-- Recipe cards will be populated here -->
      </div>

      <!-- Error State -->
      <div id="error" class="hidden py-12 text-center">
        <div class="mb-2 text-red-500 text-lg">Failed to load recipes</div>
        <button
          onclick="loadRecipes()"
          class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-white transition-colors"
        >
          Try Again
        </button>
      </div>
    </main>

    <script>
      let recipes = [];
      let currentView = "grid";

      // Load recipes from API
      async function loadRecipes() {
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");
        const container = document.getElementById("recipeContainer");

        try {
          loading.classList.remove("hidden");
          error.classList.add("hidden");

          const response = await fetch("https://dummyjson.com/recipes");
          const data = await response.json();

          recipes = data.recipes;
          displayRecipes();
        } catch (err) {
          console.error("Error loading recipes:", err);
          error.classList.remove("hidden");
        } finally {
          loading.classList.add("hidden");
        }
      }

      // Display recipes in current view mode
      function displayRecipes() {
        const container = document.getElementById("recipeContainer");

        if (currentView === "grid") {
          container.className =
            "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6";
          container.innerHTML = recipes
            .map((recipe) => createGridCard(recipe))
            .join("");
        } else {
          container.className = "space-y-4";
          container.innerHTML = recipes
            .map((recipe) => createListCard(recipe))
            .join("");
        }
      }

      // Create grid card HTML
      function createGridCard(recipe) {
        return `
                <div class="bg-white shadow-md hover:shadow-lg rounded-lg overflow-hidden transition-shadow duration-300">
                    <div class="bg-gray-200 aspect-h-12 aspect-w-16">
                        <img src="${recipe.image}" 
                             alt="${recipe.name}" 
                             class="w-full h-48 object-cover"
                             onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZTVlN2ViIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxNCIgZmlsbD0iIzZiNzI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='">
                    </div>
                    <div class="p-4">
                        <h3 class="mb-2 font-semibold text-gray-800 text-lg line-clamp-2">${recipe.name}</h3>
                        <div class="space-y-2">
                            <div class="flex items-center text-gray-600 text-sm">
                                <span class="bg-blue-100 px-2 py-1 rounded-full font-medium text-blue-800 text-xs">
                                    ${recipe.cuisine}
                                </span>
                            </div>
                            <div class="flex items-center text-gray-600 text-sm">
                                <svg class="mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span>${recipe.cookTimeMinutes} minutes</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;
      }

      // Create list card HTML
      function createListCard(recipe) {
        return `
                <div class="bg-white shadow-md hover:shadow-lg rounded-lg overflow-hidden transition-shadow duration-300">
                    <div class="flex">
                        <div class="flex-shrink-0 bg-gray-200 w-32 h-32">
                            <img src="${recipe.image}" 
                                 alt="${recipe.name}" 
                                 class="w-full h-full object-cover"
                                 onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTI4IiBoZWlnaHQ9IjEyOCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cmVjdCB3aWR0aD0iMTAwJSIgaGVpZ2h0PSIxMDAlIiBmaWxsPSIjZTVlN2ViIi8+PHRleHQgeD0iNTAlIiB5PSI1MCUiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIxMiIgZmlsbD0iIzZiNzI4MCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZHk9Ii4zZW0iPk5vIEltYWdlPC90ZXh0Pjwvc3ZnPg=='">
                        </div>
                        <div class="flex-1 p-4">
                            <h3 class="mb-2 font-semibold text-gray-800 text-xl">${recipe.name}</h3>
                            <div class="flex items-center space-x-4 text-gray-600 text-sm">
                                <span class="bg-blue-100 px-3 py-1 rounded-full font-medium text-blue-800">
                                    ${recipe.cuisine}
                                </span>
                                <div class="flex items-center">
                                    <svg class="mr-1 w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                    </svg>
                                    <span>${recipe.cookTimeMinutes} minutes</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
      }

      // View toggle functionality
      document
        .getElementById("gridView")
        .addEventListener("click", function () {
          if (currentView !== "grid") {
            currentView = "grid";
            this.classList.add("bg-blue-600", "text-white");
            this.classList.remove("text-gray-600", "hover:bg-gray-100");

            document
              .getElementById("listView")
              .classList.remove("bg-blue-600", "text-white");
            document
              .getElementById("listView")
              .classList.add("text-gray-600", "hover:bg-gray-100");

            displayRecipes();
          }
        });

      document
        .getElementById("listView")
        .addEventListener("click", function () {
          if (currentView !== "list") {
            currentView = "list";
            this.classList.add("bg-blue-600", "text-white");
            this.classList.remove("text-gray-600", "hover:bg-gray-100");

            document
              .getElementById("gridView")
              .classList.remove("bg-blue-600", "text-white");
            document
              .getElementById("gridView")
              .classList.add("text-gray-600", "hover:bg-gray-100");

            displayRecipes();
          }
        });

      // Load recipes when page loads
      loadRecipes();
    </script>
  </body>
</html>
